name: CI validation gate

# GAMP 5 re-provability: every change re-runs the regression suite, so
# "validated" stays provable on demand and a regression blocks the merge.
# The DB-backed validation harnesses (validation/validate_*.py) need the local
# chembl_33 database and Open Targets cache, so they are NOT run here; the pytest
# suite is designed so its DB / network (RCSB, UniProt) / xTB integration tests
# SKIP cleanly when those are unavailable, leaving the unit + hygiene tests as the
# always-on gate. See validation/TRACEABILITY_MATRIX.md.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression suite (DB / network / xTB tests skip cleanly)
        run: pytest tests -q
